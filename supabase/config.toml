project_id = "unifind"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
# Anonymous sign-ins are disabled by default; V1 has no signup/login (see
# the product spec's "no user registration in V1" requirement), so every
# visitor gets an anonymous session instead — see src/proxy.ts. Must
# also be enabled in the linked project's dashboard
# (Authentication → Sign In / Providers → Anonymous) once one exists,
# since this file only configures local dev.
enable_anonymous_sign_ins = true

[auth.email]
# Not offered anywhere in the V1 UI, but left enabled at the project level
# rather than disabled outright — this is the config an eventual "create
# an account" upgrade flow (linking email/password onto an existing
# anonymous session, see src/proxy.ts's comment) would need turned on.
enable_signup = true
enable_confirmations = false
