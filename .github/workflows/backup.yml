name: Weekly DB backup

on:
  schedule:
    # Sundays 03:00 UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # GitHub runners have Docker → the CLI's bundled pg_dump works here
      # (it failed locally only because Docker Desktop wasn't running).
      - name: Install Supabase CLI
        run: npm i -g supabase@2.115.1-beta.13
      - name: Dump schema + data
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npx supabase db dump --linked -f backup-schema.sql
          npx supabase db dump --linked --data-only -f backup-data.sql \
            -x public.user_profiles,public.user_nmt_scores,public.user_subject_strengths,public.user_language_proficiency,public.user_test_scores,public.user_qualifications,public.user_match_weights,public.saved_programmes,public.comparisons,public.comparison_items,public.data_issue_reports
      - name: Upload to S3-compatible storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET }}
          AWS_ENDPOINT_URL: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          DATE=$(date +%Y-%m-%d)
          aws s3 cp backup-schema.sql "s3://$BACKUP_BUCKET/$DATE/schema.sql"
          aws s3 cp backup-data.sql   "s3://$BACKUP_BUCKET/$DATE/data.sql"
